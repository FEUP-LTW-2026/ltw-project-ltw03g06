<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LTW GYM - Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

<header>
    <nav class="main-nav">
        <a href="index.html" class="logo">LTW GYM</a>

        <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="index.html" class="nav-link u-lift">Home</a></li>
            <li><a href="trainers.html" class="nav-link u-lift">Trainers</a></li>
            <li><a href="classes.html" class="nav-link u-lift">Classes</a></li>
            <li><a href="about.html" class="nav-link u-lift">About Us</a></li>
            <li><a href="contact.html" class="nav-link active u-lift">Contact</a></li>
        </ul>

        <div class="nav-actions">
            <button class="icon-btn u-lift" aria-label="Search">
                <svg class="nav-icon">
                    <use href="assets/img/icons.svg#icon-search"></use>
                </svg>
            </button>

            <a href="profile.html" class="nav-link u-lift">
                <svg class="nav-icon">
                    <use href="assets/img/icons.svg#icon-user"></use>
                </svg>
                <span>PROFILE</span>
            </a>
        </div>
    </nav>
</header>

<main class="contact-page">

    <div class="contact-header">
        <h1>Contact Us</h1>
        <p>Get in touch with our team.</p>
    </div>

    <div class="contact-container">

        <!-- FORM -->
        <section class="contact-form-section">
            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your email">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="6" placeholder="Your message"></textarea>
                </div>

                <button type="submit" class="submit-btn u-lift">
                    Send Message
                </button>

            </form>
        </section>

        <!-- INFO -->
        <section class="contact-info">

            <div class="info-card">
                <h3>Email</h3>
                <p>ltwgym@email.com</p>
            </div>

            <div class="info-card">
                <h3>Phone</h3>
                <p>+351 912 345 678</p>
            </div>

            <div class="info-card">
                <h3>Location</h3>
                <p>Porto, Portugal</p>
            </div>

        </section>

    </div>

</main>

<footer>
    <div class="footer-content">
        <p>SOCIAL</p>
        <div class="gold-line"></div>

        <ul>
            <li>
                <a href="#" class="u-lift">
                    <svg class="social-icon">
                        <use href="assets/img/icons.svg#icon-facebook"></use>
                    </svg>
                </a>
            </li>

            <li>
                <a href="#" class="u-lift">
                    <svg class="social-icon">
                        <use href="assets/img/icons.svg#icon-instagram"></use>
                    </svg>
                </a>
            </li>

            <li>
                <a href="#" class="u-lift">
                    <svg class="social-icon">
                        <use href="assets/img/icons.svg#icon-x"></use>
                    </svg>
                </a>
            </li>
        </ul>
    </div>
</footer>

<script src="js/nav.js" defer></script>
</body>
</html>
