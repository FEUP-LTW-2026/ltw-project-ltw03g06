<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTW GYM - Edit Profile</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

    <header>
        <nav class="main-nav">
            <a href="index.html" class="logo">LTW GYM</a>

            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
            </button>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-link u-lift">Home</a></li>
                <li><a href="trainers.html" class="nav-link u-lift">Trainers</a></li>
                <li><a href="classes.html" class="nav-link u-lift">Classes</a></li>
                <li><a href="about.html" class="nav-link u-lift">About Us</a></li>
                <li><a href="contact.html" class="nav-link u-lift">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <a href="index.html" class="nav-link u-lift logout-link">LOGOUT</a>
            </div>
        </nav>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h1>My Account</h1>
                <p>Update your personal details and membership settings</p>
            </div>

            <form action="#" method="post" class="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" value="Alex Smith">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" value="alex.smith@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="plan">Membership Plan</label>
                    <select id="plan" name="plan">
                        <option value="monthly">Monthly - €29.99</option>
                        <option value="quarterly" selected>Quarterly - €79.99</option>
                        <option value="annual">Annual - €299.99</option>
                    </select>
                </div>

                <div class="profile-actions">
                    <button type="submit" class="btn btn--gold u-lift">Save Changes</button>
                    <a href="index.html" class="btn btn--outline u-lift">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>SOCIAL</p>
            <div class="gold-line"></div>
            <ul>
                <li><a href="#" class="u-lift"><svg class="social-icon"><use href="assets/img/icons.svg#icon-facebook"></use></svg></a></li>
                <li><a href="#" class="u-lift"><svg class="social-icon"><use href="assets/img/icons.svg#icon-instagram"></use></svg></a></li>
                <li><a href="#" class="u-lift"><svg class="social-icon"><use href="assets/img/icons.svg#icon-x"></use></svg></a></li>
            </ul>
        </div>
    </footer>

    <script src="js/nav.js" defer></script>
</body>
</html>
