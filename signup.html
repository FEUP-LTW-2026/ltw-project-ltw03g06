<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTW GYM - Sign Up</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>

    <header>
        <nav class="main-nav">
            <a href="index.html" class="logo">LTW GYM</a>

            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
            </button>

            <ul class="nav-links">
                <li><a href="index.html" class="nav-link u-lift">Home</a></li>
                <li><a href="trainers.html" class="nav-link u-lift">Trainers</a></li>
                <li><a href="classes.html" class="nav-link u-lift">Classes</a></li>
                <li><a href="about.html" class="nav-link u-lift">About Us</a></li>
                <li><a href="contact.html" class="nav-link u-lift">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="icon-btn u-lift" aria-label="Search">
                    <svg class="nav-icon"><use href="assets/img/icons.svg#icon-search"></use></svg>
                </button>
                
                <a href="profile.html" class="nav-link u-lift">
                    <svg class="nav-icon"><use href="assets/img/icons.svg#icon-user"></use></svg>
                    <span>PROFILE</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="signup-container">
        <div class="signup-form">
            <h1>Join LTW GYM</h1>
            <p>Start your elite fitness journey today</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+351 ..." required>
                </div>

                <div class="form-group">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected>Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="plan">Membership Plan</label>
                    <select id="plan" name="plan" required>
                        <option value="" disabled selected>Choose a plan</option>
                        <option value="monthly">Monthly - €29.99</option>
                        <option value="quarterly">Quarterly - €79.99</option>
                        <option value="annual">Annual - €299.99</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree with the <a href="#" target="_blank">terms and conditions</a></label>
                </div>

                <button type="submit" class="btn btn--gold u-lift full-width-btn">Create Account</button>
            </form>
        </div>
    </main>

    <footer>
        </footer>

    <script src="js/nav.js" defer></script>
</body>
</html>
